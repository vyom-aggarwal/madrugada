# Madrugada configuration. All thresholds, weights, and levels live here; code must not hardcode them.

grid:
  slot_minutes: 15
  slots_per_day: 96

heat:
  shade_trigger_f: 80        # Cal/OSHA shade trigger
  high_heat_f: 95            # Cal/OSHA high-heat procedures
  cost_levels:               # heat_cost(T): below shade -> 0, shade..high -> 1, >= high -> 3
    below_shade: 0
    shade_to_high: 1
    high: 3

smoke:
  aqi_unhealthy_sensitive: 101
  aqi_wildfire_rule: 151     # Cal/OSHA wildfire smoke rule trigger
  cost_levels:               # smoke_cost(AQI): < 101 -> 0, 101..150 -> 1, >= 151 -> 3
    below_101: 0
    from_101_to_150: 1
    at_or_above_151: 3

# Dual-hazard is our own tunable definition, not a regulatory threshold.
dual_hazard:
  temp_f: 90
  aqi: 101

weights:
  w_heat: 1.0
  w_smoke: 1.0
  w_dual: 2.0

# Verify PM2.5->AQI breakpoints against current EPA table.
# Rows: [pm_low, pm_high, aqi_low, aqi_high], PM2.5 24h in ug/m3 (truncated to 0.1).
# Based on the 2024 EPA PM2.5 NAAQS revision as best known; every row is unverified.
aqi_pm25:
  status: unverified
  breakpoints:
    - [0.0, 9.0, 0, 50]          # unverified
    - [9.1, 35.4, 51, 100]       # unverified
    - [35.5, 55.4, 101, 150]     # unverified
    - [55.5, 125.4, 151, 200]    # unverified
    - [125.5, 225.4, 201, 300]   # unverified
    - [225.5, 325.4, 301, 500]   # unverified

# PurpleAir correction, EPA US-wide: pm = a*pm_cf1 + b*RH + c (verify against Barkjohn et al. 2021).
# Coefficients and threshold below are UNVERIFIED.
purpleair:
  a_pm_cf1: 0.524
  b_rh: -0.0862
  c_intercept: 5.75
  warn_above_ugm3: 250       # formula known to underestimate above ~250 ug/m3

shift:
  max_blocks: 2
  min_block_hours: 2
  min_gap_hours: 1
  default_paid_hours: 8.5          # = B1 and B2 lengths, so comparisons are like for like
  # Tunable assumptions, NOT legal limits:
  default_earliest_start: "04:00"
  default_latest_end: "19:00"

pareto:
  paid_fraction_max: 1.0
  paid_fraction_min: 0.8
  paid_fraction_step: 0.05
  heat_smoke_ratios: [0.25, 0.5, 1.0, 2.0, 4.0]   # w_heat / w_smoke

baselines:
  B1: {label: "Fixed 07:00-15:30", start: "07:00", end: "15:30"}
  B2: {label: "Fixed early 05:30-14:00", start: "05:30", end: "14:00"}
  # Heat-only: blind to smoke, so the dual term (which needs AQI) is off too.
  B3: {label: "Heat-only optimizer", w_smoke: 0.0, w_dual: 0.0}

forecast:
  weight_prev_day: 0.5
  weight_prior_mean: 0.5
  prior_days: 7              # mean over D-1 .. D-7 (includes D-1)

# Real-data sources for data/fetch_real.py. ALL URLs, parameter names, response field names and
# units are UNVERIFIED: check against current CIMIS and AirNow API docs before relying on them.
real_data:
  region: fresno
  local_tz: America/Los_Angeles  # DayRecord slots are local clock time, including daylight time
  max_missing_hours: 4       # per field; gaps (incl. the skipped spring-forward hour) are interpolated
  cimis:
    # Time convention (UNVERIFIED): hour-ending timestamps in Pacific Standard Time year-round (no DST).
    time_convention: hour_ending_fixed_offset
    source_utc_offset_hours: -8
    url: "https://et.water.ca.gov/api/data"     # unverified
    station: "80"                               # Fresno State (unverified)
    units: "M"                                  # metric: C, %, W/m2 (unverified)
    data_items: {temp_f: hly-air-tmp, rh: hly-rel-hum, solar_wm2: hly-sol-rad}  # unverified
    response_fields: {temp_f: HlyAirTmp, rh: HlyRelHum, solar_wm2: HlySolRad}   # unverified
  airnow:
    url: "https://www.airnowapi.org/aq/data/"   # unverified
    bbox: "-120.1,36.5,-119.5,37.0"             # lon_min,lat_min,lon_max,lat_max near Fresno (unverified)
    # Time convention (UNVERIFIED): hour-beginning. A "UTC" field is UTC; otherwise DateObserved +
    # HourObserved are local to the zone named in LocalTimeZone, using these offsets.
    time_convention: utc_or_local_fields
    local_tz_offsets: {PST: -8, PDT: -7}

# Scenario-averaged ("robust") planner, app/robust.py.
robust:
  min_residual_days: 7       # fewer -> non-robust plan + flag robust_fallback_insufficient_history
  max_residual_days: 14      # residual window: days D-1 .. D-14 (each needs its own leakage-safe forecast)
  uncertainty_percentile: 90

# Evaluation harness, eval/. See CLAUDE.md "Evaluation rules".
eval:
  strata:                    # assigned on OBSERVED data over the whole day
    heat_temp_f: 95          # "heat" if max temp >= this
    smoke_aqi: 101           # "smoke" if max AQI >= this
  tie_hours: 0.125           # tie: every physical metric differs by < tie_hours ...
  tie_cost: 1.0e-6           # ... and observed cost by < tie_cost
  bootstrap: {resamples: 10000, seed: 20250801, min_n: 10}
  min_real_days: 20
  sensitivity:
    w_heat: [0.5, 1, 2]
    w_smoke: [0.5, 1, 2]
    w_dual: [0, 1, 2]
    cost_levels: [[0, 1, 3], [0, 1, 2], [0, 1, 5]]   # applied to both heat and smoke levels
  forecast_proxies:          # default_blend is the `forecast` section above (unchanged)
    prev_day_only: {weight_prev_day: 1.0, weight_prior_mean: 0.0}
    mean_7day_only: {weight_prev_day: 0.0, weight_prior_mean: 1.0}
